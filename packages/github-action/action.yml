name: "CodeHero Scan"
description: "Roda o scanner CodeHero, envia o relatório à API e avalia o Quality Gate."
author: "CodeHero"
branding:
  icon: "shield"
  color: "blue"

inputs:
  server-url:
    description: "Base URL da API CodeHero (ex: https://codehero.web.app/api)"
    required: true
  token:
    description: "Token de ingestão do projeto (secret)"
    required: true
  org-id:
    description: "ID da organização"
    required: true
  project-id:
    description: "ID do projeto"
    required: true
  repo-id:
    description: "ID do repositório dentro do projeto (um projeto pode consolidar vários repos)"
    required: true
  path:
    description: "Caminho a analisar"
    required: false
    default: "."
  fail-on:
    description: "Severidade mínima que reprova o job (BLOCKER|CRITICAL|MAJOR|MINOR|INFO)"
    required: false
    default: "CRITICAL"
  coverage:
    description: >
      Caminho(s) do relatório de cobertura já produzido pelos seus testes, um
      por linha. Formatos detectados pelo conteúdo: lcov, Cobertura XML
      (coverage.py/coverlet), JaCoCo XML e `go test -coverprofile`.
      Sem isto, a condição de cobertura do quality gate é PULADA — não reprova.
    required: false
    default: ""
  metrics:
    description: >
      Calcula complexidade ciclomática, cognitiva, aninhamento, tamanho de
      função e densidade de comentários via tree-sitter (JS/TS/Python/Java/Go/C#)
      e parsers estruturais leves para COBOL/T-SQL. Custa alguns segundos no
      scan; ligado por padrão porque no CI isso não pesa. DB2 SQL dedicado e
      VB.Net ainda ficam de fora deste passo.
    required: false
    default: "true"
  semantic:
    description: >
      Camada semântica TypeScript (origem de chamadas stdlib vs projeto) para
      cortar FP em regras estruturais. Implica metrics=true. Recomendado em repos TS.
    required: false
    default: "false"
  oxlint:
    description: >
      Roda Oxlint (JS/TS) e importa SARIF como EXT:oxlint:*. Soft-fail se npx/oxlint
      falhar. Parte do Presence Pack.
    required: false
    default: "false"
  semgrep:
    description: >
      Roda Semgrep (--config auto) e importa SARIF como EXT:semgrep:*. Soft-fail se
      o binário não existir. Preferível em multi-lang; em JS puro Oxlint costuma bastar.
      Para OSS puro, prefira opengrep (compatível com as mesmas rulesets).
    required: false
    default: "false"
  opengrep:
    description: >
      Roda Opengrep (LGPL, Semgrep-compatible) → EXT:opengrep:*. Soft-fail se ausente.
      Bom default open-source no PR; combine com CodeQL via import-sarif no nightly.
    required: false
    default: "false"
  sca:
    description: >
      SCA de dependências (Trivy fs por padrão, ou osv-scanner via sca-tool).
      Achados EXT:trivy:* / EXT:osv-scanner:* participam do gate.
    required: false
    default: "false"
  sca-tool:
    description: "trivy | osv — qual scanner SCA usar quando sca=true"
    required: false
    default: "trivy"
  import-sarif:
    description: >
      Caminho(s) de SARIF produzido por OUTRA ferramenta, um por linha —
      CodeQL, Semgrep, linters nativos, jscpd, osv-scanner, trivy. Os
      apontamentos entram no relatório com procedência explícita (nome da
      ferramenta e id de regra original preservados) e PARTICIPAM do quality
      gate. É o caminho para fluxo entre arquivos e para dependência
      vulnerável (SCA), que o motor determinístico não cobre.
    required: false
    default: ""
  joern:
    description: >
      Opt-in Code Property Graph via Joern (requer JDK+joern-scan ou Docker).
      Achados entram como EXT:joern:* no mesmo SARIF. Desligado por padrão —
      CPG é a decisão de arquitetura mais pesada (JVM no ambiente de scan).
    required: false
    default: "false"

outputs:
  sarif-file:
    description: "Caminho do relatório de análise gerado"
    value: ${{ steps.scan.outputs.sarif }}
  findings-md:
    description: "Caminho do relatório Markdown de apontamentos (ficha completa, para autofix por agente de IA)"
    value: ${{ steps.upload.outputs.findings-md }}

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    # `required: true` em input de composite action NÃO é validado pelo runner:
    # um input ausente chega como string vazia e só quebra lá no upload, com
    # mensagem críptica. Falhar aqui, nomeando o que falta, é o que torna a
    # integração diagnosticável por quem está configurando.
    - name: Validar configuração
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        TOKEN: ${{ inputs.token }}
        ORG_ID: ${{ inputs.org-id }}
        PROJECT_ID: ${{ inputs.project-id }}
        REPO_ID: ${{ inputs.repo-id }}
      run: |
        missing=""
        [ -n "$SERVER_URL" ] || missing="$missing server-url"
        [ -n "$TOKEN" ]      || missing="$missing token"
        [ -n "$ORG_ID" ]     || missing="$missing org-id"
        [ -n "$PROJECT_ID" ] || missing="$missing project-id"
        [ -n "$REPO_ID" ]    || missing="$missing repo-id"
        if [ -n "$missing" ]; then
          echo "::error::CodeHero: input(s) obrigatório(s) sem valor:$missing"
          echo "::error::Configure as variables/secrets correspondentes no repositório (Settings > Secrets and variables > Actions)."
          exit 1
        fi

    - name: Run CodeHero scanner
      id: scan
      shell: bash
      env:
        HERO_CORE_URL: ${{ inputs.server-url }}
        HERO_TOKEN: ${{ inputs.token }}
        HERO_ORG_ID: ${{ inputs.org-id }}
        HERO_PROJECT_ID: ${{ inputs.project-id }}
        HERO_COVERAGE: ${{ inputs.coverage }}
        HERO_METRICS: ${{ inputs.metrics }}
        HERO_SEMANTIC: ${{ inputs.semantic }}
        HERO_IMPORT_SARIF: ${{ inputs.import-sarif }}
        HERO_JOERN: ${{ inputs.joern }}
        HERO_OXLINT: ${{ inputs.oxlint }}
        HERO_SEMGREP: ${{ inputs.semgrep }}
        HERO_OPENGREP: ${{ inputs.opengrep }}
        HERO_SCA: ${{ inputs.sca }}
        HERO_SCA_TOOL: ${{ inputs.sca-tool }}
      run: |
        COV_ARGS=()
        while IFS= read -r p; do
          [ -n "$p" ] && COV_ARGS+=(--coverage "$p")
        done <<< "$HERO_COVERAGE"

        EXTRA_ARGS=()
        [ "$HERO_METRICS" = "true" ] && EXTRA_ARGS+=(--metrics)
        [ "$HERO_SEMANTIC" = "true" ] && EXTRA_ARGS+=(--semantic)
        [ "$HERO_JOERN" = "true" ] && EXTRA_ARGS+=(--joern)
        [ "$HERO_OXLINT" = "true" ] && EXTRA_ARGS+=(--with-oxlint)
        [ "$HERO_OPENGREP" = "true" ] && EXTRA_ARGS+=(--with-opengrep)
        [ "$HERO_SEMGREP" = "true" ] && EXTRA_ARGS+=(--with-semgrep)
        if [ "$HERO_SCA" = "true" ]; then
          EXTRA_ARGS+=(--with-sca)
          [ -n "$HERO_SCA_TOOL" ] && EXTRA_ARGS+=(--sca-tool "$HERO_SCA_TOOL")
        fi
        while IFS= read -r p; do
          [ -n "$p" ] && EXTRA_ARGS+=(--import "$p")
        done <<< "$HERO_IMPORT_SARIF"

        if [ -f packages/scanner/dist/index.js ]; then
          node packages/scanner/dist/index.js "${{ inputs.path }}" --sarif --out codehero.sarif \
            "${COV_ARGS[@]}" "${EXTRA_ARGS[@]}" \
            --server "$HERO_CORE_URL" --token "$HERO_TOKEN" --org "$HERO_ORG_ID" --project "$HERO_PROJECT_ID" || true
        else
          npx --yes @codehero/scanner "${{ inputs.path }}" --sarif --out codehero.sarif \
            "${COV_ARGS[@]}" "${EXTRA_ARGS[@]}" \
            --server "$HERO_CORE_URL" --token "$HERO_TOKEN" --org "$HERO_ORG_ID" --project "$HERO_PROJECT_ID" || true
        fi
        if [ ! -f codehero.sarif ]; then
          echo "::error::CodeHero: o scanner não gerou codehero.sarif (binário ausente ou falha na execução)."
          echo "::error::No monorepo, rode o build do scanner antes desta action; fora dele, verifique o pacote @codehero/scanner."
          exit 1
        fi
        echo "sarif=codehero.sarif" >> "$GITHUB_OUTPUT"

    - name: Upload to CodeHero platform
      id: upload
      shell: bash
      env:
        HERO_URL: ${{ inputs.server-url }}
        HERO_TOKEN: ${{ inputs.token }}
        ORG_ID: ${{ inputs.org-id }}
        PROJECT_ID: ${{ inputs.project-id }}
        REPO_ID: ${{ inputs.repo-id }}
      run: |
        node "${{ github.action_path }}/upload.mjs"

    - name: Upload analysis report to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: codehero.sarif

    # Ficha completa (risco/motivo/como corrigir/exemplo) por apontamento em
    # Markdown — worklist pronta para um agente de IA (Copilot/Claude/Cursor)
    # aplicar o autofix, sem precisar reconsultar a plataforma.
    - name: Publicar relatório de apontamentos (autofix por IA)
      if: always() && steps.upload.outputs.findings-md != ''
      uses: actions/upload-artifact@v4
      with:
        name: codehero-findings
        path: ${{ steps.upload.outputs.findings-md }}
        retention-days: 30
