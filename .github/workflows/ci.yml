name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Usa o script da raiz em vez de repetir a lista aqui.
      #
      # A lista era mantida a mao e derivou: `build:cpg` nunca foi adicionado
      # quando o pacote @codehero/cpg-joern entrou, entao o scanner compilava
      # contra um dist que nao existia e a CI ficou vermelha em main por varios
      # commits seguidos. Uma lista duplicada so precisa ser esquecida uma vez.
      - name: Build packages
        run: npm run build

      - name: Test
        run: npm test
