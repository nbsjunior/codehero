name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Usa o script da raiz em vez de repetir a lista aqui.
      #
      # A lista era mantida a mao e derivou: `build:cpg` nunca foi adicionado
      # quando o pacote @codehero/cpg-joern entrou, entao o scanner compilava
      # contra um dist que nao existia e a CI ficou vermelha em main por varios
      # commits seguidos. Uma lista duplicada so precisa ser esquecida uma vez.
      - name: Build packages
        run: npm run build

      - name: Test
        run: npm test

      # Verdade conhecida: 2740 casos com gabarito, em ~30s.
      #
      # Ate isto existir, toda mudanca de regra era feita no escuro: apertar um
      # detector para matar um falso positivo levava junto verdadeiros
      # positivos que ninguem contava. O acervo e clonado aqui porque e de
      # terceiros e nao entra no repositorio.
      - name: Baixar OWASP BenchmarkJava
        run: git clone --depth 1 --quiet https://github.com/OWASP-Benchmark/BenchmarkJava.git .tmp/benchmark-java

      # `--exige-acervo` faz o passo REPROVAR se o clone falhar, em vez de
      # passar em silencio. Gate que pula sozinho quando o dado some deixa de
      # ser gate no primeiro problema de rede.
      - name: Precisao e recall contra a linha de base
        run: node scripts/benchmark-gate.mjs --exige-acervo

      # O acervo do OWASP e sintetico: mede se a regra reconhece o defeito
      # plantado. Nao mede o que decide a adocao, que e quanto a ferramenta
      # grita em codigo real.
      #
      # Com 75.6% de precisao no OWASP, o axios levava 15.7 BLOCKER por mil
      # linhas — 73% deles de UMA regra cujo regex casava `../`, ou seja, todo
      # import relativo. Nada pegava, porque nenhum acervo sintetico tem o
      # idioma de um projeto de verdade.
      - name: Baixar acervo de codigo real
        run: |
          git clone --depth 1 --quiet https://github.com/expressjs/express.git .tmp/real/express
          git clone --depth 1 --quiet https://github.com/axios/axios.git .tmp/real/axios
          git clone --depth 1 --quiet https://github.com/pallets/flask.git .tmp/real/flask
          git clone --depth 1 --quiet https://github.com/google/gson.git .tmp/real/gson

      - name: Ruido em codigo real contra a linha de base
        run: node scripts/ruido-gate.mjs --exige-acervo
