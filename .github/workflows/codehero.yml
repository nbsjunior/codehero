name: CodeHero Analysis

on:
  pull_request:
  push:
    branches: [main]

jobs:
  codehero:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publica SARIF na aba Security
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para o diff de "new code"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências do monorepo
        run: npm ci

      # A action usa packages/scanner/dist quando existe e só cai no
      # `npx @codehero/scanner` fora do monorepo. Sem este build o dist não
      # existe no runner e o scan era pulado silenciosamente.
      - name: Build do scanner
        run: npm run build:contracts && npm run build:engine && npm run build:scanner

      - name: CodeHero Scan
        uses: ./packages/github-action
        with:
          server-url: ${{ vars.HERO_CORE_URL }}
          token: ${{ secrets.HERO_TOKEN }}
          org-id: ${{ vars.HERO_ORG_ID }}
          project-id: ${{ vars.HERO_PROJECT_ID }}
          repo-id: ${{ vars.HERO_REPO_ID }}
          path: "."
          fail-on: CRITICAL
