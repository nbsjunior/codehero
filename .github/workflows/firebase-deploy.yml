name: Deploy CodeHero para Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências do monorepo
        run: npm ci

      - name: Build dos contratos e das Functions
        run: npm run build

      - name: Build do dashboard (Next.js)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
        run: npm run build

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      # Deploy restrito a hosting:codehero + funções do CodeHero. Firestore
      # rules/indexes e Storage rules são PROPOSITALMENTE excluídos: o projeto
      # "apponti" é compartilhado com outros apps (myabba.com.br) que já
      # gerenciam essas regras em seu próprio pipeline — um deploy de
      # firestore:rules a partir daqui sobrescreveria a regra de produção
      # deles por inteiro (Firestore tem um único ruleset por banco).
      # As regras do CodeHero (firestore.rules deste repo) precisam ser
      # mescladas manualmente no arquivo de regras canônico do projeto
      # compartilhado antes de irem para produção — ver docs/ARCHITECTURE.md.
      - name: Deploy (Hosting codehero + Functions)
        run: firebase deploy --only "hosting:codehero,functions:ingestAnalysis,functions:listIssues,functions:sddSpec,functions:generateSddSpec,functions:provisionProject,functions:flagIssueFeedback,functions:submitFixResult" --project apponti --non-interactive
