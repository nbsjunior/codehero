name: Deploy CodeHero para Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências do monorepo
        run: npm ci

      - name: Build dos contratos e das Functions
        run: npm run build

      - name: Build do dashboard (Next.js)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIRESTORE_DATABASE_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Habilitar experimento webframeworks (Next.js Hosting)
        run: firebase experiments:enable webframeworks

      # Deploy only CodeHero hosting, named Firestore DB, dedicated storage bucket,
      # and CodeHero Cloud Functions (never other apps' rules/buckets/functions).
      - name: Deploy (Hosting + Functions + Firestore + Storage)
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: firebase deploy --only "hosting:codehero,firestore:codehero,storage:apponti-codehero,functions:ingestAnalysis,functions:listIssues,functions:sddSpec,functions:generateSddSpec,functions:provisionProject,functions:flagIssueFeedback,functions:submitFixResult,functions:adminListAllProjects,functions:checkPlatformAdmin,functions:ruleforgeDaily,functions:runRuleforgeDaily" --project apponti --non-interactive
