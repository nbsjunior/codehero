name: Deploy CodeHero para Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências do monorepo
        run: npm ci

      - name: Build dos contratos e das Functions
        run: npm run build

      - name: Build do dashboard (Next.js static export)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "false"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIRESTORE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIRESTORE_DATABASE_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      # Runtime env das Functions. O Firebase CLI lê apps/functions/.env no
      # deploy; o arquivo é gitignored, então é montado aqui a partir de
      # variables do repositório. Ligar o Claude no Vertex vira uma mudança
      # de variable + re-run do workflow, sem editar código.
      - name: Montar .env das Functions
        run: |
          cat > apps/functions/.env <<EOF
          HERO_VERTEX_ENABLED=${{ vars.HERO_VERTEX_ENABLED || 'false' }}
          HERO_VERTEX_REGION=${{ vars.HERO_VERTEX_REGION || 'global' }}
          EOF
          echo "--- apps/functions/.env ---"
          cat apps/functions/.env

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      # Static hosting (apps/web/out) + named Firestore DB + storage + CodeHero functions.
      - name: Deploy (Hosting + Functions + Firestore + Storage)
        run: firebase deploy --only "hosting:codehero,firestore:codehero,storage,functions:ingestAnalysis,functions:processIngestJob,functions:purgeStaleDetail,functions:runDetailPurgeNow,functions:getPlatformOpsSettings,functions:setPlatformOpsSettings,functions:repairIngestQueues,functions:autoRepairIngestQueues,functions:listIssues,functions:sddSpec,functions:generateSddSpec,functions:provisionProject,functions:flagIssueFeedback,functions:submitFixResult,functions:exportRuleforgeFeedback,functions:applyOfflineTriage,functions:applyCodeEmbedClusters,functions:adminListAllProjects,functions:checkPlatformAdmin,functions:adminListAllIssues,functions:adminGetPlatformSummary,functions:adminListUsers,functions:adminSetPlatformAdmin,functions:adminUpdateUser,functions:adminResetUserPassword,functions:adminCreateProject,functions:getOrgQuotasCallable,functions:setOrgQuotas,functions:ruleforgeDaily,functions:runRuleforgeDaily,functions:listRuleforgeRuns,functions:submitDressCode,functions:listDressCodes,functions:listMotorRules,functions:deleteOverlayRule,functions:listRuleProposals,functions:reviewRuleProposal,functions:cveWatchlistSync,functions:runCveWatchlistSyncNow,functions:listCveWatchlist,functions:previewRepoScan,functions:registerAccount,functions:rotateIngestToken,functions:getActiveRules,functions:getActiveRulesCallable,functions:getRulesCatalog,functions:startGithubActionInstall,functions:githubOAuthCallback,functions:addRepoToProject,functions:listProjectRepos,functions:listFeatureFlags,functions:setFeatureFlag,functions:setRepoAutoScan,functions:runRepoAutoScanNow,functions:autoScanRepos" --project apponti --non-interactive

      - name: Restaurar package.json das Functions
        if: always()
        run: node scripts/restore-functions-package.mjs
